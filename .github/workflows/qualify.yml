name: Qualify pinned DiffCI installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
  diffci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      # The fixture change: 372e682 edits src/alpha.js and neither test. Later commits only touch this
      # workflow, so observing HEAD^..HEAD would qualify a workflow-only change (DiffCI/core#172).
      FIXTURE_BASE: 913665c81d7b9aede14cb260aa35ea3edbf5f9d6
      FIXTURE_HEAD: 372e682f713902437d5865fa58c41e80ba23166f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FIXTURE_HEAD }}
          fetch-depth: 0
      - id: observe
        uses: DiffCI/core@12aa9f63829330b7d5dc6feee5e02245bdc578c4 # action-v0.3.54
        with:
          base-sha: ${{ env.FIXTURE_BASE }}
          head-sha: ${{ env.FIXTURE_HEAD }}
          artifact-name: diffci-installation-qualification
      - name: Require the fixture's expected selection
        shell: bash
        env:
          DIFFCI_STATUS: ${{ steps.observe.outputs.status }}
          DIFFCI_FULL: ${{ steps.observe.outputs.full-suite-required }}
          DIFFCI_TESTS: ${{ steps.observe.outputs.affected-tests }}
        run: |
          set -euo pipefail
          echo "status=$DIFFCI_STATUS full-suite-required=$DIFFCI_FULL affected-tests=$DIFFCI_TESTS"
          test "$DIFFCI_STATUS" = "OBSERVED"
          test "$DIFFCI_FULL" = "false"
          test "$DIFFCI_TESTS" = '["test/alpha.test.js"]'
