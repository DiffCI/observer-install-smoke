name: Qualify pinned DiffCI installation
on:
  workflow_dispatch:
permissions:
  contents: read
# DiffCI's own qualification runs are not usage; keep them out of the counts.
env:
  DO_NOT_TRACK: "1"
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
  diffci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Observe the fixture change itself, not whatever commit is at HEAD. Later commits only edit this
      # workflow, and a workflow-only change correctly falls back to the full suite, so HEAD^..HEAD checks
      # nothing (DiffCI/core#172).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 372e682f713902437d5865fa58c41e80ba23166f
          fetch-depth: 0
          persist-credentials: false
      - id: observe
        uses: DiffCI/core@637167fc3791153b33f0183f68d94e4d09796e4d # action-v0.3.60
        with:
          base-sha: 913665c81d7b9aede14cb260aa35ea3edbf5f9d6
          head-sha: 372e682f713902437d5865fa58c41e80ba23166f
          artifact-name: diffci-installation-qualification
      - name: Require exactly test/alpha.test.js
        env:
          STATUS: ${{ steps.observe.outputs.status }}
          FULL: ${{ steps.observe.outputs.full-suite-required }}
          AFFECTED: ${{ steps.observe.outputs.affected-tests }}
          REASON: ${{ steps.observe.outputs.reason }}
        run: |
          echo "status=$STATUS full-suite-required=$FULL affected=$AFFECTED reason=$REASON"
          test "$STATUS" = "OBSERVED" || { echo "::error::observation status is $STATUS, expected OBSERVED"; exit 1; }
          test "$FULL" = "false" || { echo "::error::fell back to the full suite: $REASON"; exit 1; }
          node -e '
            const got = JSON.parse(process.env.AFFECTED);
            if (JSON.stringify(got) !== JSON.stringify(["test/alpha.test.js"])) {
              console.log(`::error::expected ["test/alpha.test.js"], got ${JSON.stringify(got)}`);
              process.exit(1);
            }'
